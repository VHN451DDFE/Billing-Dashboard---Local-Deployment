<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人设置 - 计费系统</title>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f0f2f5; color:#333; }
        .navbar {
            background:linear-gradient(135deg,#667eea,#764ba2); color:#fff;
            display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:56px;
        }
        .nav-left h1 { font-size:20px; }
        .nav-right { display:flex; align-items:center; gap:12px; }
        .nav-right a, .nav-right button {
            color:#fff; text-decoration:none; font-size:13px; padding:6px 12px; border-radius:6px;
            background:rgba(255,255,255,.15); border:none; cursor:pointer; font-family:inherit;
        }
        .container { max-width:900px; margin:30px auto; padding:0 20px; display:grid; grid-template-columns:280px 1fr; gap:24px; }
        .profile-card {
            background:#fff; border-radius:14px; padding:32px 24px; text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,.06); height:fit-content;
        }
        .avatar { font-size:72px; margin-bottom:12px; }
        .profile-card h2 { font-size:20px; margin-bottom:6px; }
        .role-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:600; margin-bottom:20px; }
        .role-admin { background:#fff2f0; color:#ff4d4f; } .role-user { background:#e6f7ff; color:#1890ff; }
        .info-list { text-align:left; border-top:1px solid #f0f0f0; padding-top:16px; }
        .info-item { display:flex; justify-content:space-between; padding:8px 0; font-size:14px; }
        .info-label { color:#888; } .info-value { font-weight:500; }
        .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
        .card h3 { margin-bottom:18px; color:#1a1a2e; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:14px; font-weight:600; margin-bottom:5px; }
        .form-group input { width:100%; padding:10px; border:1.5px solid #d9d9d9; border-radius:8px; font-size:14px; font-family:inherit; }
        .form-group input:focus { border-color:#667eea; outline:none; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .btn { padding:10px 22px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
        .btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(102,126,234,.3); }
        .msg { font-size:13px; font-weight:500; margin-left:12px; }
        .msg-success { color:#52c41a; } .msg-error { color:#ff4d4f; }
        @media (max-width:768px) { .container{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left"><h1>⚙️ 个人设置</h1></div>
        <div class="nav-right">
            <span id="navUser"></span>
            <a href="/user.html">📊 我的面板</a>
            <span id="adminLink"></span>
            <button onclick="logout()">退出</button>
        </div>
    </nav>

    <div class="container">
        <div class="profile-card">
            <div class="avatar">👤</div>
            <h2 id="profileName"></h2>
            <div class="role-badge" id="profileRole"></div>
            <div class="info-list">
                <div class="info-item"><span class="info-label">📧 邮箱</span><span class="info-value" id="infoEmail">-</span></div>
                <div class="info-item"><span class="info-label">📱 手机</span><span class="info-value" id="infoPhone">-</span></div>
                <div class="info-item"><span class="info-label">📅 注册时间</span><span class="info-value" id="infoDate">-</span></div>
            </div>
        </div>
        <div>
            <div class="card"><h3>📝 编辑资料</h3>
                <form onsubmit="updateProfile(event)">
                    <div class="form-row"><div class="form-group"><label>邮箱</label><input type="email" id="email"></div>
                    <div class="form-group"><label>手机号</label><input type="tel" id="phone"></div></div>
                    <button type="submit" class="btn btn-primary">💾 保存</button><span class="msg" id="profileMsg"></span>
                </form>
            </div>
            <div class="card"><h3>🔒 修改密码</h3>
                <form onsubmit="changePassword(event)">
                    <div class="form-group"><label>原密码</label><input type="password" id="oldPw" required></div>
                    <div class="form-row"><div class="form-group"><label>新密码</label><input type="password" id="newPw" required minlength="6"></div>
                    <div class="form-group"><label>确认新密码</label><input type="password" id="confirmPw" required minlength="6"></div></div>
                    <button type="submit" class="btn btn-primary">🔐 修改密码</button><span class="msg" id="pwMsg"></span>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API = {
            get: url => fetch(url, {headers:{'Authorization':'Bearer '+localStorage.getItem('token')}}).then(r=>r.json()),
            put: (url,data) => fetch(url, {method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify(data)}).then(r=>r.json()),
        };

        if (!localStorage.getItem('token')) { window.location.href='/login.html'; }
        document.getElementById('navUser').textContent = '👤 '+localStorage.getItem('username');
        document.getElementById('profileName').textContent = localStorage.getItem('username');
        const role = localStorage.getItem('role');
        document.getElementById('profileRole').textContent = role==='admin'?'管理员':'普通用户';
        document.getElementById('profileRole').className = 'role-badge '+(role==='admin'?'role-admin':'role-user');
        if(role==='admin') document.getElementById('adminLink').innerHTML='<a href="/admin.html">🛡️ 管理后台</a>';

        async function loadProfile() {
            const r = await API.get('/api/auth/me');
            if(r.success) {
                document.getElementById('email').value = r.user.email||'';
                document.getElementById('phone').value = r.user.phone||'';
                document.getElementById('infoEmail').textContent = r.user.email||'-';
                document.getElementById('infoPhone').textContent = r.user.phone||'-';
                document.getElementById('infoDate').textContent = r.user.created_at||'-';
            }
        }

        async function updateProfile(e) {
            e.preventDefault(); const msg=document.getElementById('profileMsg');
            const r=await API.put('/api/profile',{email:document.getElementById('email').value,phone:document.getElementById('phone').value});
            msg.textContent=r.message; msg.className='msg '+(r.success?'msg-success':'msg-error');
            if(r.success) { loadProfile(); setTimeout(()=>msg.textContent='',3000); }
        }

        async function changePassword(e) {
            e.preventDefault(); const msg=document.getElementById('pwMsg'); const newPw=document.getElementById('newPw').value;
            if(newPw!==document.getElementById('confirmPw').value) { msg.textContent='两次新密码不一致'; msg.className='msg msg-error'; return; }
            const r=await API.put('/api/profile/password',{old_password:document.getElementById('oldPw').value,new_password:newPw,confirm:document.getElementById('confirmPw').value});
            msg.textContent=r.message; msg.className='msg '+(r.success?'msg-success':'msg-error');
            if(r.success) { document.querySelector('#profilePage form').reset(); setTimeout(()=>msg.textContent='',3000); }
        }

        function logout() { localStorage.clear(); window.location.href='/login.html'; }

        loadProfile();
    </script>
</body>
</html>
