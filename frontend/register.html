<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 计费仪表盘</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            background: #fff; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .auth-card h1 { text-align: center; font-size: 24px; color: #1a1a2e; margin-bottom: 6px; }
        .auth-card .subtitle { text-align: center; font-size: 14px; color: #888; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group label .required { color: #ff4d4f; }
        .form-group input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #d9d9d9; border-radius: 8px;
            font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #11998e; box-shadow: 0 0 0 3px rgba(17,153,142,0.12); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn {
            display: block; width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(17,153,142,0.35); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; padding: 10px 16px;
            border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center; display: none; }
        .error.show { display: block; }
        .success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; padding: 10px 16px;
            border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center; display: none; }
        .success.show { display: block; }
        .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .footer a { color: #11998e; font-weight: 600; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>📝 创建账号</h1>
        <p class="subtitle">注册一个新的计费仪表盘账户</p>

        <div id="errorBox" class="error"></div>
        <div id="successBox" class="success"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>👤 用户名 <span class="required">*</span></label>
                <input type="text" id="username" placeholder="至少 2 个字符" required minlength="2">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>📧 邮箱</label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>📱 手机号</label>
                    <input type="tel" id="phone" placeholder="13800000000">
                </div>
            </div>
            <div class="form-group">
                <label>🔒 密码 <span class="required">*</span></label>
                <input type="password" id="password" placeholder="至少 6 位" required minlength="6">
            </div>
            <div class="form-group">
                <label>🔒 确认密码 <span class="required">*</span></label>
                <input type="password" id="confirm" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">注 册</button>
        </form>

        <div class="footer">
            <span>已有账号？</span>
            <a href="/login.html">立即登录 →</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errBox = document.getElementById('errorBox');
            const sucBox = document.getElementById('successBox');
            errBox.classList.remove('show');
            sucBox.classList.remove('show');

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) {
                errBox.textContent = '两次密码不一致';
                errBox.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        phone: document.getElementById('phone').value.trim(),
                        password: password,
                        confirm: confirm,
                    }),
                });
                const result = await resp.json();

                if (result.success) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('username', result.user.username);
                    localStorage.setItem('role', result.user.role);
                    localStorage.setItem('userId', result.user.id);
                    sucBox.textContent = '注册成功！正在跳转...';
                    sucBox.classList.add('show');
                    setTimeout(() => { window.location.href = '/user.html'; }, 1000);
                } else {
                    errBox.textContent = result.message;
                    errBox.classList.add('show');
                }
            } catch (err) {
                errBox.textContent = '网络错误，请检查服务器连接';
                errBox.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = '注 册';
            }
        }
    </script>
</body>
</html>
